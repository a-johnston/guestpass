<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Guestpass</title>
  <link rel="stylesheet" href="css/app.css" />
  <script type="module" src="js/main.js"></script>
  <!-- Every static import of main.js, so the module graph loads in one round trip instead of one per
       import level. test/preload.test.js keeps this list in sync; highlight.js is loaded on demand. -->
  <link rel="modulepreload" href="vendor/marked.esm.min.js" />
  <link rel="modulepreload" href="vendor/purify.es.min.mjs" />
  <link rel="modulepreload" href="js/api.js" />
  <link rel="modulepreload" href="js/attachments.js" />
  <link rel="modulepreload" href="js/compact.js" />
  <link rel="modulepreload" href="js/compaction-config.js" />
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/content.js" />
  <link rel="modulepreload" href="js/fallbacks.js" />
  <link rel="modulepreload" href="js/frames.js" />
  <link rel="modulepreload" href="js/items.js" />
  <link rel="modulepreload" href="js/markdown.js" />
  <link rel="modulepreload" href="js/media.js" />
  <link rel="modulepreload" href="js/panes.js" />
  <link rel="modulepreload" href="js/recall.js" />
  <link rel="modulepreload" href="js/responses.js" />
  <link rel="modulepreload" href="js/session.js" />
  <link rel="modulepreload" href="js/source.js" />
  <link rel="modulepreload" href="js/srcdoc.js" />
  <link rel="modulepreload" href="js/stream.js" />
  <link rel="modulepreload" href="js/tools.js" />
</head>
<body>
  <!-- Without a #<payload> link: build one. With one: chat. -->
  <section id="setup" hidden>
    <form id="setup-form">
      <h1>Guestpass</h1>
      <p class="hint">Create a shareable link to any OpenAI-compatible server.</p>
      <label>Server base URL
        <input id="cfg-baseurl" type="url" placeholder="https://llm.example.com:8443/v1" required />
      </label>
      <label>API key
        <input id="cfg-apikey" type="password" placeholder="optional" autocomplete="off" />
      </label>
      <label>System prompt
        <textarea id="cfg-system" rows="3" placeholder="optional"></textarea>
      </label>
      <p id="cfg-status" class="hint" role="status"></p>
      <fieldset class="share">
        <legend>Link</legend>
        <div class="row">
          <input id="share-link" readonly aria-label="Link" />
          <button type="button" id="copy-share">Copy</button>
        </div>
      </fieldset>
      <div class="actions">
        <span class="spacer"></span>
        <button type="submit" class="primary">Connect</button>
      </div>
    </form>
  </section>

  <div id="app" hidden>
    <section id="chat-col">
      <header id="topbar">
        <strong class="brand">Guestpass</strong>
        <span id="status" class="status" data-state="idle" role="img" aria-label="Not connected"><span class="dot"></span></span>
        <span id="ctx" class="ctx" role="status" hidden></span>
        <button type="button" id="clear-media" class="clear-media" title="Stop re-sending images, files and page HTML with every request. The chat keeps them." hidden>Compact</button>
        <!-- One group pushed right, so the icons stay at the right edge together even when the bar wraps. -->
        <div class="topbar-actions">
        <div class="opts-wrap">
          <button type="button" id="opts-btn" class="icon-btn" aria-label="Options" aria-haspopup="dialog" aria-expanded="false" aria-controls="opts">
            <!-- gear: a dashed ring (8 teeth: circumference 2π·6.6 ≈ 41.5 / 8) over a thick body ring -->
            <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><g fill="none" stroke="currentColor"><circle cx="8" cy="8" r="6.6" stroke-width="2.2" stroke-dasharray="2.6 2.58" transform="rotate(-11 8 8)"/><circle cx="8" cy="8" r="4.3" stroke-width="3"/></g></svg>
          </button>
          <div id="opts" class="popover" role="dialog" aria-label="Options" hidden>
            <fieldset>
              <legend>Thinking kept when compacting</legend>
              <label><input type="radio" name="think-mode" value="all" checked /> All turns</label>
              <label><input type="radio" name="think-mode" value="turn" /> Current turn only</label>
              <p class="muted small">Applied when history is compacted; new steps are sent whole until then.</p>
            </fieldset>
          </div>
        </div>
        <a class="icon-btn repo-link" href="https://github.com/a-johnston/guestpass" target="_blank" rel="noopener noreferrer" aria-label="Guestpass on GitHub">
          <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button type="button" id="panes-show" class="icon-btn" title="Show panes" aria-label="Show panes" hidden>⇤</button>
        </div>
      </header>

      <main id="messages" aria-live="polite">
        <div id="empty" class="empty">
          <p>Say hello, or try one of these:</p>
          <div id="starters" class="starters"></div>
        </div>
      </main>

      <div id="queue" aria-live="polite" hidden></div>
      <div id="attachments" class="attachments" aria-live="polite" hidden></div>
      <form id="composer">
        <button type="button" id="attach-btn" class="attach-btn" title="Attach files" aria-label="Attach files">+</button>
        <input type="file" id="attach-input" multiple hidden />
        <div class="prompt-wrap">
          <textarea id="prompt" rows="1" autocomplete="off" aria-label="Message"></textarea>
          <button id="stop-btn" type="button" class="stop-btn" title="Stop generating (Esc)" aria-label="Stop generating" hidden></button>
        </div>
        <button id="send-btn" type="submit" class="primary">Send</button>
      </form>
    </section>

    <div id="resizer" role="separator" aria-orientation="vertical" hidden></div>

    <aside id="panes" hidden>
      <div class="pane-bar">
        <div id="pane-tabs" role="tablist"></div>
        <button type="button" id="panes-hide" class="icon-btn" title="Hide panes" aria-label="Hide panes">⇥</button>
      </div>
      <div id="pane-body"></div>
    </aside>
  </div>
</body>
</html>
